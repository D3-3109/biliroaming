name: Build arm64 APK

on:
  push:
    branches: [ splash-918 ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # 必须递归拉子模块：app/src/main/jni/dex_builder 是构建 native 库的前提。
          submodules: recursive
          # jgit 插件靠提交数算 versionCode，需要完整历史。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK/NDK packages
        run: |
          sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Provide local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> local.properties

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少仓库 secret KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > key.p12
          {
            echo "releaseStoreFile=key.p12"
            echo "releaseStorePassword=$KEYSTORE_PASSWORD"
            echo "releaseKeyAlias=$KEY_ALIAS"
            echo "releaseKeyPassword=$KEY_PASSWORD"
            echo "org.gradle.jvmargs=-Xmx4096m"
            echo "org.gradle.parallel=true"
            echo "android.native.buildOutput=verbose"
          } >> gradle.properties

      - name: Build arm64 release
        run: |
          ./gradlew :app:assembleRelease \
            -PappVerName=9.18-splash \
            --no-daemon --console=plain

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK=$APK"
          cp "$APK" bilili_biliroaming-splash-arm64-v8a.apk

          echo "=== ABI 目录（应只有 arm64-v8a）==="
          unzip -l bilili_biliroaming-splash-arm64-v8a.apk | grep 'lib/' || echo "无 lib"

          echo "=== Xposed 声明 ==="
          unzip -l bilili_biliroaming-splash-arm64-v8a.apk | grep -E 'xposed_init|META-INF'

          echo "=== 签名 ==="
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --print-certs bilili_biliroaming-splash-arm64-v8a.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: biliroaming-splash-arm64-v8a
          path: bilili_biliroaming-splash-arm64-v8a.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bilili_biliroaming-splash-arm64-v8a.apk
